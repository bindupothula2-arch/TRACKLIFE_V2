<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrackLife</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>💚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Noto+Sans+Telugu:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--teal:#0E4A47;--teal2:#16645F;--mint:#EAF4F1;--paper:#F7FBFA;--ink:#12302F;--muted:#5C7775;
--gold:#F2A93B;--gold2:#FBE3B8;--coral:#C8452D;--line:#D5E6E2;--white:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans','Noto Sans Telugu',system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.55}
h1,h2,h3{font-family:'Sora','Noto Sans Telugu',sans-serif;margin:0 0 .4em;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}
/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:var(--teal);color:#fff;padding:56px 48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.hero h1{font-size:clamp(2.2rem,4.5vw,3.6rem);line-height:1.08;max-width:12ch}
.hero p{max-width:34ch;color:#cfe6e2;font-size:1.1rem}
.pulse{position:absolute;right:-40px;bottom:30px;width:420px;opacity:.9}
.pulse path{stroke:var(--gold);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.logo{font-family:Sora;font-weight:700;font-size:1.4rem}.logo i{color:var(--gold);font-style:normal}
.authform{padding:48px;display:flex;align-items:center;justify-content:center}
.authform .box{width:100%;max-width:400px}
.tabs{display:flex;gap:6px;background:var(--mint);padding:4px;border-radius:12px;margin-bottom:20px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--teal);box-shadow:0 1px 4px #0001}
label{display:block;font-size:.85rem;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
textarea{resize:vertical;min-height:70px}
.pw{position:relative}.pw button{position:absolute;right:6px;top:5px;border:0;background:none;cursor:pointer;color:var(--teal2);font-weight:600;padding:6px 8px}
.btn{border:0;background:var(--teal);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--teal2)}.btn.gold{background:var(--gold);color:#3b2600}
.btn.ghost{background:none;color:var(--teal);border:1.5px solid var(--line)}
.btn.small{padding:7px 12px;font-size:.85rem}.btn.full{width:100%;margin-top:18px}
.err{background:#FBE7E2;color:var(--coral);border-left:4px solid var(--coral);padding:10px 12px;border-radius:8px;margin-top:12px;font-size:.92rem}
.langsw{position:absolute;top:18px;right:18px}
.langsw button{border:1.5px solid var(--line);background:#fff;padding:6px 12px;border-radius:20px;cursor:pointer;font-weight:600}
/* app shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.rail{background:var(--teal);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.rail .logo{margin:0 8px 22px}
.rail button.nav{background:none;border:0;color:#cfe6e2;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer;font-weight:500}
.rail button.nav.on{background:#ffffff1c;color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.rail .sp{flex:1}
main{padding:32px 36px;max-width:1100px;width:100%}
.greet{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.greet h1{font-size:1.9rem}.greet p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
.card h3{font-size:1.05rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--mint);border-radius:14px;padding:16px}.stat b{font-family:Sora;font-size:1.9rem;display:block;color:var(--teal)}
.stat span{color:var(--muted);font-size:.88rem}
.stat.due{background:var(--gold2)}.stat.due b{color:#7a4a00}
.item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.item small{color:var(--muted);display:block}
.sev{display:inline-block;min-width:26px;text-align:center;border-radius:7px;font-weight:700;font-size:.8rem;padding:2px 7px;background:var(--mint);color:var(--teal)}
.sev.h{background:#FBE7E2;color:var(--coral)}.sev.m{background:var(--gold2);color:#7a4a00}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{color:var(--muted);padding:14px 0}
.note{font-size:.82rem;color:var(--muted);margin-top:10px}
.cred{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.92rem}
.cred code{background:var(--mint);padding:3px 8px;border-radius:6px}
/* chat */
.chat{display:flex;flex-direction:column;height:520px}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
.m{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-wrap}
.m.u{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:4px}
.m.b{align-self:flex-start;background:var(--mint);border-bottom-left-radius:4px}
.m.e{align-self:flex-start;background:#FBE7E2;color:var(--coral);border-left:4px solid var(--coral)}
.doc{margin-top:8px;padding:8px 10px;background:var(--gold2);border-radius:9px;font-size:.9rem;color:#5a3700}
.chatin{display:flex;gap:8px;margin-top:10px}
.disc{font-size:.78rem;color:var(--muted);margin-top:8px}
.cat{font-weight:600;font-size:.82rem;color:var(--teal);background:var(--mint);display:inline-block;padding:2px 9px;border-radius:20px;margin:14px 0 4px}
.an{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:.9rem}
.an ul{margin:4px 0 0 18px;padding:0}.rep a{color:var(--teal2);font-weight:600}
.fab{position:fixed;right:18px;bottom:18px;width:64px;height:64px;border-radius:50%;border:0;background:var(--gold);color:#3b2600;font-size:1.9rem;cursor:pointer;box-shadow:0 8px 24px #0004;z-index:8}
.fab.on,.bigmic.on{animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.08);box-shadow:0 0 0 14px #F2A93B44}}
.vwrap{text-align:center}
.bigmic{width:150px;height:150px;border-radius:50%;border:0;background:var(--gold);font-size:4rem;cursor:pointer;box-shadow:0 10px 30px #F2A93B66;margin:10px auto}
.vstat{font-family:Sora,'Noto Sans Telugu';font-size:1.3rem;margin:10px 0;min-height:1.8em}
.vbox{background:var(--mint);border-radius:14px;padding:14px;margin:10px auto;max-width:560px;text-align:left;font-size:1.15rem}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;max-width:620px;margin:12px auto}
.quick button{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px 8px;font-size:1.05rem;font-weight:600;cursor:pointer}
.quick button span{display:block;font-size:2.4rem}
.quick button:hover{border-color:var(--gold)}
.spk{border:0;background:none;cursor:pointer;font-size:1rem}
/* toast */
#toasts{position:fixed;right:18px;bottom:96px;display:flex;flex-direction:column;gap:10px;z-index:9}
.toast{background:var(--teal);color:#fff;padding:14px 16px;border-radius:12px;border-left:6px solid var(--gold);box-shadow:0 8px 24px #0003;max-width:300px}
@media(max-width:820px){
 .auth{grid-template-columns:1fr}.hero{padding:32px 24px;min-height:260px}.pulse{width:260px;opacity:.5}
 .authform{padding:28px 20px}.shell{grid-template-columns:1fr}
 .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px}.rail .logo{margin:0 10px 0 0}.rail .sp{display:none}
 main{padding:20px 16px}.row{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){.pulse path{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<div id="toasts" aria-live="polite"></div>
<button id="fab" class="fab hidden" onclick="fabTalk()" aria-label="Talk">🎤</button>

<!-- AUTH -->
<section id="auth" class="auth hidden">
  <div class="langsw"><button onclick="toggleLang()" id="langbtn">తెలుగు</button></div>
  <div class="hero">
    <div class="logo">Track<i>Life</i></div>
    <div>
      <h1 data-t="heroTitle"></h1>
      <p data-t="heroSub"></p>
    </div>
    <svg class="pulse" viewBox="0 0 420 120" aria-hidden="true"><path d="M0 70 H120 L145 20 L180 105 L210 45 L230 70 H420"/></svg>
  </div>
  <div class="authform"><div class="box">
    <div class="tabs"><button id="tabIn" class="on" onclick="setTab('in')" data-t="login"></button><button id="tabUp" onclick="setTab('up')" data-t="register"></button></div>
    <div id="regOnly" class="hidden">
      <label data-t="iam"></label>
      <select id="role" onchange="roleChange()"><option value="patient" data-t="patient"></option><option value="doctor" data-t="doctor"></option></select>
      <label data-t="fullName"></label><input id="name" autocomplete="name">
      <div class="row"><div><label data-t="age"></label><input id="age" type="number" min="0" max="120"></div>
      <div><label data-t="phone"></label><input id="phone" type="tel"></div></div>
      <div id="specBox" class="hidden"><label data-t="specialty"></label><input id="specialty" placeholder="Cardiologist, General Physician..."></div>
    </div>
    <label data-t="email"></label><input id="email" type="email" autocomplete="email">
    <label data-t="password"></label>
    <div class="pw"><input id="password" type="password" autocomplete="current-password"><button type="button" onclick="togglePw('password',this)" data-t="show"></button></div>
    <div id="authErr" class="err hidden"></div>
    <button class="btn full" onclick="submitAuth()" id="authBtn"></button>
  </div></div>
</section>

<!-- APP -->
<div id="app" class="shell hidden">
  <nav class="rail">
    <div class="logo">Track<i>Life</i></div>
    <div id="navItems" style="display:contents"></div>
    <div class="sp"></div>
    <button class="nav" onclick="toggleLang()" id="langbtn2">తెలుగు</button>
    <button class="nav" onclick="logout()" data-t="logout"></button>
  </nav>
  <main id="main"></main>
</div>

let lang=localStorage.getItem('tl_lang')||'en', me=null, tab='in', page='home', sessionPw=null, selPid=null;
let cache={records:[],meds:[]}, chatLog=[];
const t=k=>T[lang][k]||k;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',body){
  const r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw Object.assign(new Error(j.error||'Error'),{data:j,status:r.status});
  return j;
}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  const other=lang==='en'?'తెలుగు':'English';
  $('langbtn').textContent=other;$('langbtn2').textContent=other;
  $('authBtn').textContent=tab==='in'?t('loginBtn'):t('registerBtn');
  if(me) render();
}
function toggleLang(){lang=lang==='en'?'te':'en';localStorage.setItem('tl_lang',lang);applyLang()}
function setTab(x){tab=x;$('tabIn').classList.toggle('on',x==='in');$('tabUp').classList.toggle('on',x==='up');
  $('regOnly').classList.toggle('hidden',x==='in');$('authErr').classList.add('hidden');
  $('password').autocomplete=x==='in'?'current-password':'new-password';applyLang()}
function roleChange(){$('specBox').classList.toggle('hidden',$('role').value!=='doctor')}
function togglePw(id,btn){const i=$(id);const s=i.type==='password';i.type=s?'text':'password';btn.textContent=s?t('hide'):t('show')}
async function submitAuth(){
  const e=$('authErr');e.classList.add('hidden');
  try{
    const pw=$('password').value;
    if(tab==='in') await api('login','POST',{email:$('email').value,password:pw});
    else await api('register','POST',{role:$('role').value,name:$('name').value,age:$('age').value,phone:$('phone').value,
      specialty:$('specialty').value,email:$('email').value,password:pw});
    sessionPw=pw;$('password').value='';
    await boot();
  }catch(x){e.textContent=x.message;e.classList.remove('hidden')}
}
async function logout(){await api('logout','POST');me=null;sessionPw=null;chatLog=[];location.reload()}
async function boot(){
  try{me=await api('me')}catch{me=null}
  $('auth').classList.toggle('hidden',!!me);$('app').classList.toggle('hidden',!me);
  $('fab').classList.toggle('hidden',!(me&&me.role==='patient'));
  if(me){page='home';await load();buildNav();render();startReminders()}
  applyLang();
}
async function load(){
  if(me.role==='patient'){[cache.records,cache.meds,cache.reports]=await Promise.all([api('records'),api('meds'),api('reports')])}
}
function buildNav(){
  const items=me.role==='patient'?[['home','home'],['voice','voice'],['symptoms','symptoms'],['history','history'],['reports','reports'],['meds','meds'],['assistant','assistant'],['sharing','sharing']]
                                :[['home','patients']];
  $('navItems').innerHTML=items.map(([p,k])=>`<button class="nav ${p===page?'on':''}" data-p="${p}" onclick="go('${p}')">${t(k)}</button>`).join('');
}
function go(p){page=p;buildNav();render()}
function render(){
  buildNav();
  const m=$('main');
  if(me.role==='doctor') return renderDoctor(m);
  ({home:rHome,symptoms:rSymptoms,voice:rVoice,history:rHistory,reports:rReports,meds:rMeds,assistant:rAssistant,sharing:rSharing}[page])(m);
}
const greet=()=>`<div class="greet"><div><h1>${t('hello')}, ${esc((me.name||'').split(' ')[0])}</h1><p>${t('tagline')}</p></div></div>`;
const sevCls=s=>s>=8?'h':s>=5?'m':'';
function symList(limit=999){const r=cache.records.filter(x=>x.kind==='symptom').slice(0,limit);
  return r.length?r.map(x=>`<div class="item"><div><b>${esc(x.title)}</b><small>${esc(x.date)} ${x.notes?'· '+esc(x.notes):''}</small></div>
  <div><span class="sev ${sevCls(x.severity)}">${esc(x.severity||'-')}</span> <button class="x" aria-label="${t('delete')}" onclick="delRec(${x.id})">✕</button></div></div>`).join(''):`<div class="empty">${t('noSym')}</div>`}
function condList(){const r=cache.records.filter(x=>x.kind==='condition');
  return r.length?r.map(x=>`<div class="item"><div><b>${esc(x.title)}</b><small>${esc(x.date)} ${x.notes?'· '+esc(x.notes):''}</small></div>
  <button class="x" aria-label="${t('delete')}" onclick="delRec(${x.id})">✕</button></div>`).join(''):`<div class="empty">${t('noCond')}</div>`}
function medList(items=cache.meds,editable=true){return items.length?items.map(x=>`<div class="item"><div><b>${esc(x.name)}</b> ${esc(x.dose)}
  <small>${x.times.map(esc).join(' · ')} ${x.prescribed_by?'· '+esc(x.prescribed_by):''}</small></div>
  ${editable?`<button class="x" aria-label="${t('delete')}" onclick="delMed(${x.id})">✕</button>`:''}</div>`).join(''):`<div class="empty">${t('noMed')}</div>`}
function rHome(m){
  const syms=cache.records.filter(x=>x.kind==='symptom').length,conds=cache.records.filter(x=>x.kind==='condition').length;

  m.innerHTML=greet()+`<div class="stats">

   <div class="cred" style="margin-top:8px"><span>${t('password')}:</span><code id="pwv">••••••••</code>
   <button class="btn ghost small" onclick="showPw(this)">${t('show')}</button></div><p class="note">${t('pwNote')}</p><p class="note">🔒 ${t('privacy')}</p></div></div>`;

function showPw(b){const c=$('pwv');const hid=c.textContent.startsWith('•');c.textContent=hid?(sessionPw||'(sign in again to view)'):'••••••••';b.textContent=hid?t('hide'):t('show')}
function schedule(){const rows=[];cache.meds.forEach(x=>x.times.forEach(tm=>rows.push([tm,x])));rows.sort();
  return rows.length?rows.map(([tm,x])=>`<div class="item"><div><b>${tm}</b> ${esc(x.name)}<small>${esc(x.dose)}</small></div></div>`).join(''):`<div class="empty">${t('noMed')}</div>`}

  try{await api('records','POST',{kind,title:$(p+'_t').value,notes:$(p+'_n').value,date:$(p+'_d').value,severity:p==='s'?+$('s_s').value:null});
    cache.records=await api('records');render()}catch(x){const e=$(p+'_e');e.textContent=x.message;e.classList.remove('hidden')}

function rMeds(m){
  m.innerHTML=greet()+`<div class="grid"><div class="card"><h3>${t('addMed')}</h3>

function rAssistant(m){
  if(!chatLog.length) chatLog.push({c:'b',t:t('welcomeBot')});
  m.innerHTML=greet()+`<div class="card"><div class="chat"><div class="msgs" id="msgs"></div>
  <div class="chatin"><input id="q" placeholder="${t('askPh')}" onkeydown="if(event.key==='Enter')sendChat()"><button class="btn" onclick="sendChat()">${t('send')}</button></div>
  <div class="disc">${t('disc')}<br>🔒 ${t('privacy')}</div></div></div>`;
  paintChat();
}
function paintChat(){const b=$('msgs');if(!b)return;
  b.innerHTML=chatLog.map((x,i)=>`<div class="m ${x.c}">${esc(x.t)}${x.doc?`<div class="doc">🩺 ${t('visit')}: <b>${esc(x.doc)}</b></div>`:''}${x.c!=='u'?`<button class="spk" aria-label="${t('readAloud')}" onclick="speakMsg(${i})">🔊</button>`:''}</div>`).join('');b.scrollTop=b.scrollHeight}
async function sendChat(){
  const q=$('q').value.trim();if(!q)return;$('q').value='';chatLog.push({c:'u',t:q});paintChat();
  try{const r=await api('chat','POST',{message:q,lang});chatLog.push({c:'b',t:r.reply,doc:r.specialist})}
  catch(x){chatLog.push({c:'e',t:'⚠ '+x.message,doc:x.data&&x.data.specialist})}
  paintChat();
}

const CATS=['lab','imaging','prescription','discharge','other'];
function repCard(r,mine){const a=r.analysis;
  return `<div class="item rep"><div style="flex:1"><b>${esc(r.title)}</b><small>${esc(r.date)} · ${esc(r.filename)} · ${Math.round(r.size/1024)} KB ${r.notes?'· '+esc(r.notes):''}</small>
  <a href="/api/reports/${r.id}/file">${t('download')}</a>${mine&&r.has_text?` · <a href="#" onclick="analyzeRep(${r.id});return false">${t('analyze')}</a>`:''}
  ${a?`<div class="an"><b>${t('analysis')}</b><br>${esc(a.summary)}${a.findings&&a.findings.length?`<br><b>${t('findings')}</b><ul>${a.findings.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}${a.follow_up?`<b>${t('followUp')}:</b> ${esc(a.follow_up)}`:''}</div>`
  :(!r.has_text?`<div class="an">${t('noText')}</div>`:'')}</div>
  ${mine?`<button class="x" aria-label="${t('delete')}" onclick="delRep(${r.id})">✕</button>`:''}</div>`}
function grouped(list,mine){return list.length?CATS.map(c=>{const g=list.filter(r=>r.category===c);
  return g.length?`<div class="cat">${t('cat'+c)}</div>${g.map(r=>repCard(r,mine)).join('')}`:''}).join(''):`<div class="empty">${t('noRep')}</div>`}

  <label>${t('file')}</label><input id="r_f" type="file" accept=".pdf,.png,.jpg,.jpeg,.txt,application/pdf,image/png,image/jpeg,text/plain">
  <label>${t('repTitle')}</label><input id="r_t"><div class="row"><div><label>${t('category')}</label><select id="r_c"><option value="auto">${t('auto')}</option>${CATS.map(c=>`<option value="${c}">${t('cat'+c)}</option>`).join('')}</select></div>
  <div><label>${t('date')}</label><input id="r_d" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div>
  <label>${t('notes')}</label><textarea id="r_n"></textarea><div id="r_e" class="err hidden"></div>
  <button class="btn full" id="r_b" onclick="uploadRep()">${t('save')}</button><p class="note">🔒 ${t('aiNote')}</p></div>
  <div class="card"><h3>${t('reports')}</h3>${grouped(cache.reports,true)}</div></div>`;
}
async function uploadRep(){
  const e=$('r_e');e.classList.add('hidden');const f=$('r_f').files[0];
  if(!f){e.textContent=t('file');e.classList.remove('hidden');return}
  const fd=new FormData();fd.append('file',f);fd.append('title',$('r_t').value);fd.append('category',$('r_c').value);
  fd.append('date',$('r_d').value);fd.append('notes',$('r_n').value);fd.append('lang',lang);
  $('r_b').disabled=true;$('r_b').textContent=t('uploading');
  try{const r=await fetch('/api/reports',{method:'POST',body:fd});const j=await r.json().catch(()=>({error:'Upload failed'}));
    if(!r.ok)throw new Error(j.error);toast(t('uploaded'));rReports($('main'))}
  catch(x){e.textContent=x.message;e.classList.remove('hidden');$('r_b').disabled=false;$('r_b').textContent=t('save')}
}
async function analyzeRep(id){try{await api('reports/'+id+'/analyze','POST',{lang});rReports($('main'))}catch(x){toast('⚠ '+x.message)}}
async function delRep(id){await api('reports/'+id,'DELETE');rReports($('main'))}
/* voice assistant */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false,lastSpoken='',vState={heard:'',reply:'',status:''};
const locale=()=>lang==='te'?'te-IN':'en-IN';
function speak(text,onend){
  if(!('speechSynthesis' in window)){return}
  speechSynthesis.cancel();lastSpoken=text;
  const u=new SpeechSynthesisUtterance(text);u.lang=locale();u.rate=.9;
  const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').toLowerCase().startsWith(lang));
  if(v)u.voice=v;else if(lang==='te'&&speechSynthesis.getVoices().length)toast(t('noTeVoice'));
  if(onend)u.onend=onend;speechSynthesis.speak(u);
}
function speakMsg(i){const x=chatLog[i];speak(x.t+(x.doc?'. '+t('visitSay')+': '+x.doc:''))}
function listen(cb){
  if(!SR){toast(t('noVoice'));return}
  if(listening&&rec){rec.stop();return}
  speechSynthesis.cancel();rec=new SR();rec.lang=locale();rec.interimResults=false;rec.maxAlternatives=1;
  rec.onstart=()=>{listening=true;vSet('status',t('listening'));mic(true)};
  rec.onend=()=>{listening=false;mic(false);if(vState.status===t('listening'))vSet('status','')};
  rec.onerror=()=>{listening=false;mic(false);vSet('status',t('noVoice'))};
  rec.onresult=e=>cb(e.results[0][0].transcript);
  rec.start();
}
function mic(on){['fab','bigmic'].forEach(id=>{const e=$(id);if(e)e.classList.toggle('on',on)})}
function vSet(k,v){vState[k]=v;const map={status:'vstat',heard:'vheard',reply:'vreply'};const e=$(map[k]);
  if(e){e.textContent=v;if(k!=='status')e.parentElement.classList.toggle('hidden',!v)}}
function scheduleText(){const rows=[];cache.meds.forEach(x=>x.times.forEach(tm=>rows.push([tm,x])));rows.sort();
  return rows.length?t('youHave')+': '+rows.map(([tm,x])=>`${x.name} ${t('at')} ${tm}`).join(', '):t('noMedsVoice')}
async function handleVoice(text){
  vSet('heard',text);
  if(/my (medicines|tablets|reminders)|medicine (time|reminder)|నా మందు|నా మాత్ర|రిమైండర్|మందుల సమయ/i.test(text)){
    const r=scheduleText();vSet('reply',r);speak(r);return}
  if(/\breports?\b|రిపోర్ట్/i.test(text)){go('reports');speak(t('reports'));return}
  vSet('status',t('thinking'));
  try{const r=await api('chat','POST',{message:text,lang,voice:true});
    const full=r.reply+' '+t('visitSay')+': '+r.specialist;
    chatLog.push({c:'u',t:text},{c:'b',t:r.reply,doc:r.specialist});vSet('status','');vSet('reply',full);speak(full)}
  catch(x){const full=x.message+(x.data&&x.data.specialist?' '+t('visitSay')+': '+x.data.specialist:'');
    vSet('status','');vSet('reply','⚠ '+full);speak(full)}
}
function rVoice(m){
  const q=[['fever','🤒'],['head','🤕'],['stomach','🤢'],['cough','😷'],['chest','💔'],['tired','😴']];
  m.innerHTML=`<div class="vwrap"><h1>${t('voiceTitle')}</h1><p class="note" style="font-size:1rem">${t('voiceHint')}</p>
  <button id="bigmic" class="bigmic" onclick="listen(handleVoice)" aria-label="${t('voice')}">🎤</button>
  <div id="vstat" class="vstat">${esc(vState.status)}</div>
  <div class="vbox ${vState.heard?'':'hidden'}"><small>${t('heard')}</small><br><span id="vheard">${esc(vState.heard)}</span></div>
  <div class="vbox ${vState.reply?'':'hidden'}"><span id="vreply">${esc(vState.reply)}</span><br>
  <button class="btn gold small" style="margin-top:8px" onclick="speak(lastSpoken||vState.reply)">🔊 ${t('tapRepeat')}</button>
  <button class="btn ghost small" style="margin-top:8px" onclick="speechSynthesis.cancel()">⏹ ${t('stop')}</button></div>
  <p class="note" style="font-size:1rem">${t('orTap')}</p>
  <div class="quick">${q.map(([k,e])=>`<button onclick="handleVoice(t('s_${k}'))"><span>${e}</span>${t('q_'+k)}</button>`).join('')}</div></div>`;
  if(!SR)toast(t('noVoice'));
}
function fabTalk(){if(page!=='voice'){go('voice');setTimeout(()=>listen(handleVoice),150)}else listen(handleVoice)}
if('speechSynthesis' in window)speechSynthesis.getVoices();
/* reminders */
const fired=new Set();
function askNotif(){if('Notification' in window)Notification.requestPermission()}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;$('toasts').appendChild(d);setTimeout(()=>d.remove(),9000)}
let remTimer=null;
function startReminders(){
  if(me.role!=='patient'||remTimer)return;
  const tick=()=>{const n=new Date(),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'),day=n.toDateString();
    cache.meds.forEach(x=>x.times.forEach(tm=>{const k=day+x.id+tm;
      if(tm===hm&&!fired.has(k)){fired.add(k);const msg=`💊 ${t('reminderMsg')} ${x.name} ${x.dose||''}`;toast(msg);speak(`${t('reminderMsg')} ${x.name} ${x.dose||''}`);
        if('Notification' in window&&Notification.permission==='granted')new Notification('TrackLife',{body:msg})}}))};
  tick();remTimer=setInterval(tick,20000);
}
setTab('in');boot();
</script>
