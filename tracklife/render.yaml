services:
  - type: web
    name: tracklife
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PSEUDO_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
